<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Bit Hero Clash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0d12;
      color: white;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: 960px;
      height: 540px;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      display: block;
      background: linear-gradient(#101820, #16263a);
      border: 4px solid #dfe9ff;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    #ui {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #7bdcff;
    }

    .controls {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }

    .p1-controls {
      color: #c95d3d;
    }

    .p2-controls {
      color: #4ba1ff;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="game" width="960" height="540"></canvas>
  </div>
  <div id="ui">
    <div>Press R to reset | Select your hero before game starts</div>
    <div class="controls">
      <div class="p1-controls">P1: A/D move | W jump | J light | K heavy | L special</div>
      <div class="p2-controls">P2: ← → move | ↑ jump | 1 light | 2 heavy | 3 special</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
